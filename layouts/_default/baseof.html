<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#F7F7F5">
  <meta name="description" content="{{ .Description | default site.Params.description }}">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <link rel="canonical" href="{{ .Permalink }}">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.Title }}" href="{{ "index.xml" | relURL }}">
  {{ if .Params.math }}
  <!-- သင်္ချာညီမျှခြင်းများအတွက် MathJax ကို လိုအပ်သော စာမျက်နှာတွင်သာ ဖွင့်ရန် -->
  <script>
    window.MathJax = {
      tex: { inlineMath: [['\\(', '\\)'], ['$', '$']], displayMath: [['\\[', '\\]'], ['$$', '$$']] },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
  {{ end }}
</head>
<body>
  <a class="skip-link" href="#main-content">အကြောင်းအရာသို့ ကျော်သွားရန်</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="FireFly Home"><span class="brand-prompt">&gt;_</span><span>FireFly</span></a>
      <nav aria-label="Main navigation">
        <a href="{{ site.Home.RelPermalink }}"{{ if .IsHome }} aria-current="page"{{ end }}>Home</a>
        <a href="{{ "posts/" | relURL }}"{{ if eq .Section "posts" }} aria-current="page"{{ end }}>Posts</a>
        <a href="{{ "about/" | relURL }}"{{ if eq .Layout "about" }} aria-current="page"{{ end }}>About</a>
      </nav>
    </div>
  </header>
  <main id="main-content" class="shell">{{ block "main" . }}{{ end }}</main>
  <footer class="site-footer shell">
    <div class="footer-rule" aria-hidden="true">+--------------------------------------------------+</div>
    <p>Build · Learn · Share</p>
    <p class="footer-meta">© {{ now.Year }} KAUNG KHANT KO KO HAN · Written by K4H · Code: MIT · Articles: CC BY 4.0</p>
  </footer>
</body>
</html>
